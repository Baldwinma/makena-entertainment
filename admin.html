<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makena Admin Check-In</title>
    <meta name="description" content="Makena admin ticket check-in.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <a href="index.html">
                        <img src="images/logo-transparent.png" alt="Makena Logo">
                    </a>
                </div>
                <ul class="nav-links" id="navLinks">
                    <li><a href="afronation.html">Afronation</a></li>
                    <li><a href="#" id="logoutLink" hidden>Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="hero-overlay"></div>
        <div class="container">
            <h1 class="page-title">Admin Check-In</h1>
            <p class="page-subtitle">Login to scan Makena tickets and mark entry.</p>
            <p class="page-subtitle">Use Scan Tickets to open your camera and automatically check guests in.</p>
        </div>
    </section>

    <section class="events">
        <div class="container">
            <div class="check-in-panel" id="loginPanel">
                <form class="checkout-test-form" id="adminLoginForm">
                    <label for="adminUsername">Username</label>
                    <input id="adminUsername" class="check-in-input check-in-input--login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                    <label for="adminPassword">Password</label>
                    <div class="password-field">
                        <input id="adminPassword" class="check-in-input check-in-input--login password-field__input" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                        <button type="button" class="password-field__toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false">
                            <svg class="password-field__icon password-field__icon--show" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                            </svg>
                            <svg class="password-field__icon password-field__icon--hide" viewBox="0 0 24 24" aria-hidden="true" hidden>
                                <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                                <path d="M10.6 10.6a2.5 2.5 0 0 0 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                                <path d="M6.5 6.8C4.5 8.2 3 12 3 12s3.5 7 9 7c1.6 0 3-.4 4.2-1.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M14.5 5.4C15.8 5 17.4 5 19 5c5.5 0 9 7 9 7s-1.5 3.4-4.1 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-3)"></path>
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <div class="check-in-result" id="loginResult"></div>
            </div>

            <div class="check-in-panel" id="scannerPanel" hidden>
                <div class="section-header" style="margin-bottom: 1.5rem;">
                    <h2 class="section-title" style="font-size: 1.8rem;">Scan Tickets</h2>
                    <div class="title-underline"></div>
                    <p class="section-description">Choose the event first. Scans will only check in tickets for the selected event.</p>
                </div>

                <div class="event-scan-selector">
                    <div class="event-scan-selector__header">
                        <h3>Select Event</h3>
                        <button type="button" class="btn btn-secondary event-scan-selector__refresh" id="refreshEventsButton">Refresh Counts</button>
                    </div>
                    <input id="eventSearchInput" class="check-in-input check-in-input--login event-scan-search" autocomplete="off" placeholder="Search events">
                    <div class="event-scan-list" id="eventScanList"></div>
                </div>

                <div class="selected-event-summary" id="selectedEventSummary" hidden></div>

                <form class="checkout-test-form" id="checkInForm">
                    <label for="ticketCode">Ticket Code</label>
                    <input id="ticketCode" name="ticketCode" class="check-in-input" autocomplete="off" placeholder="MKN-XXXXXXXX-01">
                    <div class="check-in-actions">
                        <button type="button" class="btn btn-secondary" id="validateButton">Validate</button>
                        <button type="submit" class="btn btn-primary">Check In</button>
                    </div>
                </form>

                <div class="check-in-actions">
                    <button type="button" class="btn btn-secondary" id="scanButton">Start Camera Scan</button>
                    <button type="button" class="btn btn-secondary" id="stopScanButton" hidden>Stop Camera</button>
                </div>

                <div class="qr-scanner" id="qrScanner" hidden></div>
                <div class="check-in-result" id="checkInResult"></div>

                <div class="event-attendees" id="eventAttendeesPanel">
                    <div class="event-attendees__header">
                        <h3>Ticket Buyers</h3>
                        <span id="eventAttendeesCount"></span>
                    </div>
                    <input id="attendeeSearchInput" class="check-in-input check-in-input--login event-attendees__search" autocomplete="off" placeholder="Search buyers by name, email, or ticket code">
                    <div class="event-attendees__list" id="eventAttendeesList"></div>
                </div>

                <div class="recent-scans" id="recentScansPanel">
                    <div class="recent-scans__header">
                        <h3>Recent Scans</h3>
                        <span id="currentAdminLabel"></span>
                    </div>
                    <div class="recent-scans__list" id="recentScansList"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const tokenKey = 'makena_admin_token';
        const loginPanel = document.getElementById('loginPanel');
        const scannerPanel = document.getElementById('scannerPanel');
        const logoutLink = document.getElementById('logoutLink');
        const loginResult = document.getElementById('loginResult');
        const ticketInput = document.getElementById('ticketCode');
        const passwordInput = document.getElementById('adminPassword');
        const passwordToggle = document.getElementById('passwordToggle');
        const result = document.getElementById('checkInResult');
        const scanner = document.getElementById('qrScanner');
        const scanButton = document.getElementById('scanButton');
        const stopScanButton = document.getElementById('stopScanButton');
        const eventScanList = document.getElementById('eventScanList');
        const selectedEventSummary = document.getElementById('selectedEventSummary');
        const refreshEventsButton = document.getElementById('refreshEventsButton');
        const eventSearchInput = document.getElementById('eventSearchInput');
        const recentScansList = document.getElementById('recentScansList');
        const currentAdminLabel = document.getElementById('currentAdminLabel');
        const attendeeSearchInput = document.getElementById('attendeeSearchInput');
        const eventAttendeesList = document.getElementById('eventAttendeesList');
        const eventAttendeesCount = document.getElementById('eventAttendeesCount');
        let html5QrCode = null;
        let isScanning = false;
        let isProcessingScan = false;
        let lastScannedCode = '';
        let lastScannedAt = 0;
        let events = [];
        let attendees = [];
        let recentScans = [];
        let selectedEvent = null;
        let currentAdminUsername = '';
        let eventRefreshTimer = null;

        function getToken() {
            return localStorage.getItem(tokenKey);
        }

        function startEventRefresh() {
            stopEventRefresh();
            eventRefreshTimer = window.setInterval(() => {
                if (getToken()) {
                    loadEvents({ silent: true });
                }
            }, 30000);
        }

        function stopEventRefresh() {
            if (eventRefreshTimer) {
                window.clearInterval(eventRefreshTimer);
                eventRefreshTimer = null;
            }
        }

        function setLoggedInState(isLoggedIn) {
            loginPanel.hidden = isLoggedIn;
            scannerPanel.hidden = !isLoggedIn;
            logoutLink.hidden = !isLoggedIn;
            if (isLoggedIn) {
                loadEvents();
                startEventRefresh();
            } else {
                stopEventRefresh();
                selectedEvent = null;
                events = [];
                attendees = [];
                recentScans = [];
                currentAdminUsername = '';
                renderEvents();
                renderAttendees();
                renderRecentScans();
            }
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function extractTicketCode(value) {
            const text = String(value || '').trim();
            try {
                const url = new URL(text);
                return (url.searchParams.get('ticket') || text).trim().toUpperCase();
            } catch (error) {
                return text.trim().toUpperCase();
            }
        }

        function playSuccessSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const t = ctx.currentTime;
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.001, t + i * 0.13);
                    gain.gain.linearRampToValueAtTime(0.28, t + i * 0.13 + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.13 + 0.28);
                    osc.start(t + i * 0.13);
                    osc.stop(t + i * 0.13 + 0.28);
                });
            } catch (e) {}
        }

        function playErrorSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const t = ctx.currentTime;
                [0, 0.22].forEach(offset => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.value = 180;
                    gain.gain.setValueAtTime(0.001, t + offset);
                    gain.gain.linearRampToValueAtTime(0.28, t + offset + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.18);
                    osc.start(t + offset);
                    osc.stop(t + offset + 0.18);
                });
            } catch (e) {}
        }

        function showResult(target, type, title, body) {
            let icon = '';
            if (type === 'success') {
                icon = `<svg class="check-in-status-icon check-in-status-icon--success" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            } else if (type === 'warning' || type === 'error' || type === 'wrong-event') {
                icon = `<svg class="check-in-status-icon check-in-status-icon--fail" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
            }
            target.className = `check-in-result check-in-result--${type}`;
            target.innerHTML = `${icon}<h3>${escapeHtml(title)}</h3><p>${body}</p>`;
        }

        function getScanPercent(event) {
            if (!event || !event.totalTickets) {
                return 0;
            }
            return Math.round((event.checkedInTickets / event.totalTickets) * 100);
        }

        function formatScanTime(value) {
            if (!value) {
                return '';
            }
            try {
                return new Intl.DateTimeFormat([], {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }).format(new Date(value));
            } catch (error) {
                return value;
            }
        }

        function formatDateTime(value) {
            if (!value) {
                return '';
            }
            try {
                return new Intl.DateTimeFormat([], {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }).format(new Date(value));
            } catch (error) {
                return value;
            }
        }

        function showWrongEvent(ticket, expectedEventName, message) {
            playErrorSound();
            const actualEventName = ticket && ticket.event_name ? ticket.event_name : 'another event';
            showResult(
                result,
                'wrong-event',
                'Wrong Event Ticket',
                `${escapeHtml(message || 'This ticket is not for the selected event.')}<br><strong>Selected:</strong> ${escapeHtml(expectedEventName)}<br><strong>Ticket event:</strong> ${escapeHtml(actualEventName)}${ticket ? `<br>${describeTicket(ticket)}` : ''}`
            );
        }

        function updateSelectedEventSummary() {
            if (!selectedEvent) {
                selectedEventSummary.hidden = true;
                selectedEventSummary.innerHTML = '';
                scanButton.disabled = true;
                document.getElementById('validateButton').disabled = true;
                document.querySelector('#checkInForm button[type="submit"]').disabled = true;
                return;
            }

            selectedEventSummary.hidden = false;
            selectedEventSummary.innerHTML = `
                <div>
                    <span class="selected-event-summary__label">Scanning</span>
                    <strong>${escapeHtml(selectedEvent.name)}</strong>
                    <small>${escapeHtml(selectedEvent.date)} | ${escapeHtml(selectedEvent.time)}</small>
                </div>
                <div class="selected-event-summary__count">
                    <strong>${selectedEvent.checkedInTickets}</strong>
                    <span>/ ${selectedEvent.totalTickets} scanned</span>
                    <small>${getScanPercent(selectedEvent)}% checked in</small>
                </div>
            `;
            scanButton.disabled = false;
            document.getElementById('validateButton').disabled = false;
            document.querySelector('#checkInForm button[type="submit"]').disabled = false;
        }

        function renderEvents() {
            if (!eventScanList) {
                return;
            }

            const searchTerm = String(eventSearchInput.value || '').trim().toLowerCase();
            const visibleEvents = searchTerm
                ? events.filter(event => `${event.name} ${event.date} ${event.time}`.toLowerCase().includes(searchTerm))
                : events;

            if (!visibleEvents.length) {
                eventScanList.innerHTML = '<p class="event-scan-list__empty">No events found yet.</p>';
                updateSelectedEventSummary();
                return;
            }

            eventScanList.innerHTML = visibleEvents.map(event => {
                const isSelected = selectedEvent && selectedEvent.name === event.name;
                const percent = getScanPercent(event);
                return `
                    <button type="button" class="event-scan-card${isSelected ? ' is-selected' : ''}" data-event-name="${escapeHtml(event.name)}">
                        <span class="event-scan-card__name">${escapeHtml(event.name)}</span>
                        <span class="event-scan-card__meta">${escapeHtml(event.date)} | ${escapeHtml(event.time)}</span>
                        <span class="event-scan-card__stats">
                            <strong>${event.checkedInTickets}</strong> scanned
                            <span>${event.totalTickets} bought</span>
                        </span>
                        <span class="event-scan-card__percent">${percent}% checked in</span>
                    </button>
                `;
            }).join('');
            updateSelectedEventSummary();
        }

        function renderRecentScans() {
            currentAdminLabel.textContent = currentAdminUsername ? `Logged in as ${currentAdminUsername}` : '';

            if (!recentScans.length) {
                recentScansList.innerHTML = '<p class="recent-scans__empty">No check-ins yet.</p>';
                return;
            }

            recentScansList.innerHTML = recentScans.map(scan => `
                <div class="recent-scan-row">
                    <div>
                        <strong>${escapeHtml(scan.holder_name || 'Guest')}</strong>
                        <span>${escapeHtml(scan.event_name)}</span>
                        <small>${escapeHtml(scan.ticket_code)}</small>
                    </div>
                    <div class="recent-scan-row__meta">
                        <span>${escapeHtml(formatScanTime(scan.checked_in_at))}</span>
                        <small>${escapeHtml(scan.checked_in_by || 'Makena admin')}</small>
                    </div>
                </div>
            `).join('');
        }

        function getSelectedEventAttendees() {
            if (!selectedEvent) {
                return [];
            }

            const searchTerm = String(attendeeSearchInput.value || '').trim().toLowerCase();
            return attendees
                .filter(attendee => attendee.eventName === selectedEvent.name)
                .filter(attendee => {
                    if (!searchTerm) {
                        return true;
                    }

                    return `${attendee.holderName} ${attendee.holderEmail} ${attendee.ticketCode}`.toLowerCase().includes(searchTerm);
                });
        }

        function renderAttendees() {
            const selectedAttendees = getSelectedEventAttendees();
            const totalForEvent = selectedEvent
                ? attendees.filter(attendee => attendee.eventName === selectedEvent.name).length
                : 0;

            eventAttendeesCount.textContent = selectedEvent
                ? `${selectedAttendees.length} shown / ${totalForEvent} tickets bought`
                : 'Select an event';

            if (!selectedEvent) {
                eventAttendeesList.innerHTML = '<p class="event-attendees__empty">Select a party to see ticket buyers.</p>';
                return;
            }

            if (!selectedAttendees.length) {
                eventAttendeesList.innerHTML = '<p class="event-attendees__empty">No ticket buyers found for this party yet.</p>';
                return;
            }

            eventAttendeesList.innerHTML = selectedAttendees.map(attendee => `
                <div class="event-attendee-row">
                    <div class="event-attendee-row__person">
                        <strong>${escapeHtml(attendee.holderName || 'Guest')}</strong>
                        <span>${escapeHtml(attendee.holderEmail || 'No email')}</span>
                        <span>${escapeHtml(attendee.tierName || 'General Admission')}${attendee.tierAmount ? ` - $${(attendee.tierAmount / 100).toFixed(2)}` : ''}</span>
                        <small>${escapeHtml(attendee.ticketCode)}</small>
                    </div>
                    <div class="event-attendee-row__status">
                        <span class="event-attendee-row__badge${attendee.checkedIn ? ' is-checked-in' : ''}">
                            ${attendee.checkedIn ? 'Scanned' : 'Not scanned'}
                        </span>
                        <small>${attendee.checkedIn ? `At ${escapeHtml(formatDateTime(attendee.checkedInAt))}` : `Bought ${escapeHtml(formatDateTime(attendee.purchasedAt))}`}</small>
                    </div>
                </div>
            `).join('');
        }

        function selectEvent(eventName) {
            selectedEvent = events.find(event => event.name === eventName) || null;
            renderEvents();
            renderAttendees();
            if (selectedEvent) {
                showResult(result, 'success', 'Event Selected', `Now scanning only ${escapeHtml(selectedEvent.name)} tickets.`);
            }
        }

        function updateEventCount(eventName, checkedInTickets, totalTickets) {
            events = events.map(event => {
                if (event.name !== eventName) {
                    return event;
                }

                return {
                    ...event,
                    checkedInTickets: Number.isFinite(checkedInTickets) ? checkedInTickets : event.checkedInTickets + 1,
                    totalTickets: Number.isFinite(totalTickets) ? totalTickets : event.totalTickets
                };
            });
            if (selectedEvent && selectedEvent.name === eventName) {
                selectedEvent = events.find(event => event.name === eventName) || selectedEvent;
            }
            renderEvents();
        }

        async function loadEvents(options = {}) {
            if (!getToken()) {
                return;
            }

            if (!options.silent) {
                eventScanList.innerHTML = '<p class="event-scan-list__empty">Loading events...</p>';
            }
            const response = await authedFetch('/.netlify/functions/admin-events');
            const data = await response.json();

            if (response.status === 401) {
                localStorage.removeItem(tokenKey);
                setLoggedInState(false);
                showResult(loginResult, 'error', 'Login Required', 'Please login again.');
                return;
            }

            if (!response.ok) {
                eventScanList.innerHTML = '<p class="event-scan-list__empty">Unable to load events.</p>';
                showResult(result, 'error', 'Events Unavailable', escapeHtml(data.error || 'Refresh and try again.'));
                return;
            }

            events = data.events || [];
            attendees = data.attendees || [];
            recentScans = data.recentScans || [];
            currentAdminUsername = data.admin && data.admin.username ? data.admin.username : currentAdminUsername;
            if (selectedEvent) {
                selectedEvent = events.find(event => event.name === selectedEvent.name) || null;
            }
            renderEvents();
            renderAttendees();
            renderRecentScans();
        }

        function setPasswordVisibility(isVisible) {
            passwordInput.type = isVisible ? 'text' : 'password';
            passwordToggle.setAttribute('aria-pressed', String(isVisible));
            passwordToggle.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
            passwordToggle.querySelector('.password-field__icon--show').hidden = isVisible;
            passwordToggle.querySelector('.password-field__icon--hide').hidden = !isVisible;
        }

        function describeTicket(ticket) {
            return `${escapeHtml(ticket.event_name)}<br>${escapeHtml(ticket.holder_name || 'Guest')}${ticket.holder_email ? ` | ${escapeHtml(ticket.holder_email)}` : ''}<br>${escapeHtml(ticket.ticket_code)}`;
        }

        async function authedFetch(url, options = {}) {
            const headers = {
                ...(options.headers || {}),
                Authorization: `Bearer ${getToken()}`
            };
            return fetch(url, { ...options, headers });
        }

        async function validateTicket() {
            if (!selectedEvent) {
                showResult(result, 'error', 'Select Event', 'Choose the event you are scanning before validating tickets.');
                return null;
            }

            const code = extractTicketCode(ticketInput.value);
            ticketInput.value = code;

            if (!code) {
                showResult(result, 'error', 'Missing Code', 'Enter or scan a ticket code first.');
                return null;
            }

            const response = await authedFetch(`/.netlify/functions/validate-ticket?ticket=${encodeURIComponent(code)}&eventName=${encodeURIComponent(selectedEvent.name)}`);
            const data = await response.json();

            if (response.status === 401) {
                localStorage.removeItem(tokenKey);
                setLoggedInState(false);
                showResult(loginResult, 'error', 'Login Required', 'Please login again.');
                return null;
            }

            if (!response.ok) {
                const ticket = data.ticket ? `<br>${describeTicket(data.ticket)}` : '';
                if (data.status === 'wrong_event') {
                    showWrongEvent(data.ticket, selectedEvent.name, data.error || data.message);
                } else {
                    showResult(result, 'error', data.error || data.message || 'Ticket could not be validated.', ticket || 'Ticket could not be validated.');
                }
                return null;
            }

            if (data.status === 'already_checked_in') {
                showResult(result, 'warning', 'Already Used', `${describeTicket(data.ticket)}<br>Checked in at ${escapeHtml(data.ticket.checked_in_at)}`);
                return data.ticket;
            }

            showResult(result, 'success', 'Valid Ticket', describeTicket(data.ticket));
            return data.ticket;
        }

        async function checkInCode(code) {
            if (!selectedEvent) {
                playErrorSound();
                showResult(result, 'error', 'Select Event', 'Choose the event you are scanning before checking in tickets.');
                return null;
            }

            code = extractTicketCode(code);
            ticketInput.value = code;

            const response = await authedFetch('/.netlify/functions/check-in-ticket', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ticket: code,
                    eventName: selectedEvent.name
                })
            });
            const data = await response.json();

            if (response.status === 401) {
                localStorage.removeItem(tokenKey);
                setLoggedInState(false);
                showResult(loginResult, 'error', 'Login Required', 'Please login again.');
                return;
            }

            if (!response.ok) {
                const ticket = data.ticket ? `<br>${describeTicket(data.ticket)}` : '';
                if (data.status === 'wrong_event') {
                    showWrongEvent(data.ticket, selectedEvent.name, data.error);
                } else {
                    playErrorSound();
                    showResult(result, data.status === 'already_checked_in' ? 'warning' : 'error', data.error || 'Check-In Failed', ticket || 'Please try again.');
                }
                return;
            }

            playSuccessSound();
            showResult(result, 'success', 'Checked In', describeTicket(data.ticket));
            if (data.ticket && data.ticket.event_name === selectedEvent.name) {
                updateEventCount(selectedEvent.name);
                loadEvents();
            }
            return data.ticket;
        }

        async function checkInTicket(event) {
            event.preventDefault();
            await checkInCode(ticketInput.value);
        }

        async function stopScanner() {
            if (html5QrCode && isScanning) {
                await html5QrCode.stop();
                html5QrCode.clear();
            }

            isScanning = false;
            isProcessingScan = false;
            scanner.hidden = true;
            stopScanButton.hidden = true;
            scanButton.hidden = false;
            scanButton.textContent = 'Start Camera Scan';
        }

        async function startScanner() {
            if (!selectedEvent) {
                showResult(result, 'error', 'Select Event', 'Choose the event you are scanning before starting the camera.');
                return;
            }

            if (!window.Html5Qrcode) {
                showResult(result, 'warning', 'Scanner Not Loaded', 'The camera scanner could not load. Use your phone Camera app to scan the QR code, or enter the code manually.');
                return;
            }

            if (isScanning) {
                return;
            }

            html5QrCode = html5QrCode || new Html5Qrcode('qrScanner');
            scanner.hidden = false;
            stopScanButton.hidden = false;
            scanButton.hidden = true;
            showResult(result, 'success', 'Scanner Ready', `Point the camera at a ${escapeHtml(selectedEvent.name)} ticket QR code.`);

            try {
                await html5QrCode.start(
                    { facingMode: 'environment' },
                    {
                        fps: 10,
                        qrbox: { width: 260, height: 260 },
                        aspectRatio: 1
                    },
                    async decodedText => {
                        const code = extractTicketCode(decodedText);
                        const now = Date.now();

                        if (!code || isProcessingScan || (code === lastScannedCode && now - lastScannedAt < 3500)) {
                            return;
                        }

                        isProcessingScan = true;
                        lastScannedCode = code;
                        lastScannedAt = now;
                        ticketInput.value = code;

                        try {
                            await checkInCode(code);
                        } finally {
                            setTimeout(() => {
                                isProcessingScan = false;
                            }, 1200);
                        }
                    },
                    () => {}
                );
                isScanning = true;
            } catch (error) {
                showResult(result, 'error', 'Camera Error', `${error.message || error}. Use your phone Camera app or enter the ticket code manually.`);
                await stopScanner();
            }
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const response = await fetch('/.netlify/functions/admin-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: document.getElementById('adminUsername').value,
                    password: document.getElementById('adminPassword').value
                })
            });
            const data = await response.json();

            if (!response.ok) {
                showResult(loginResult, 'error', 'Login Failed', data.error || 'Invalid credentials.');
                return;
            }

            localStorage.setItem(tokenKey, data.token);
            setLoggedInState(true);
            if (params.get('ticket')) {
                ticketInput.value = extractTicketCode(params.get('ticket'));
                validateTicket();
            }
        });

        logoutLink.addEventListener('click', (event) => {
            event.preventDefault();
            localStorage.removeItem(tokenKey);
            setLoggedInState(false);
        });

        document.getElementById('validateButton').addEventListener('click', validateTicket);
        document.getElementById('checkInForm').addEventListener('submit', checkInTicket);
        scanButton.addEventListener('click', startScanner);
        stopScanButton.addEventListener('click', stopScanner);
        refreshEventsButton.addEventListener('click', loadEvents);
        eventSearchInput.addEventListener('input', renderEvents);
        attendeeSearchInput.addEventListener('input', renderAttendees);
        eventScanList.addEventListener('click', event => {
            const card = event.target.closest('.event-scan-card');
            if (!card) {
                return;
            }
            selectEvent(card.dataset.eventName);
        });
        passwordToggle.addEventListener('click', () => {
            setPasswordVisibility(passwordInput.type === 'password');
        });

        if (getToken()) {
            setLoggedInState(true);
            if (params.get('ticket')) {
                ticketInput.value = extractTicketCode(params.get('ticket'));
                validateTicket();
            }
        } else {
            setLoggedInState(false);
        }

        setPasswordVisibility(false);
    </script>
</body>
</html>
