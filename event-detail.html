            function escapeHtml(value) {
                return String(value || '').replace(/[&<>"']/g, function (char) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
                });
            }

            var slug = window.location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html$/, '');
            var event = events[slug];
            var root = document.getElementById('eventDetailRoot');

            if (!event) {
                document.title = 'Event Not Found | Makena Events';
                document.getElementById('eventTitle').textContent = 'Event Not Found';
                document.getElementById('eventSubtitle').textContent = 'Please return to the Afronation events page.';
                if (root) {
                    root.innerHTML = '<p class="event-description">This event page could not be found.</p><a href="afronation.html" class="btn btn-primary">View Events</a>';
                }
                return;
            }

            document.title = event.title + ' Portimão | Makena Events';
            var metaDescription = document.querySelector('meta[name="description"]');
            if (metaDescription) metaDescription.setAttribute('content', event.description);
            var canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) canonical.setAttribute('href', 'https://makenaevents.com/' + slug);

            document.getElementById('eventTitle').textContent = event.title;
            document.getElementById('eventSubtitle').textContent = event.date + ' | ' + event.time + ' | ' + event.location;
            document.getElementById('eventImage').src = event.image;
            document.getElementById('eventImage').alt = event.alt;
            document.getElementById('eventBadge').textContent = event.badge;
            document.getElementById('eventHeading').textContent = event.title;

            } else {
                description.textContent = event.description;
            }
            document.getElementById('eventFacts').innerHTML =

                '<span>' + escapeHtml(event.time) + '</span>' +
                '<span>' + (event.locationUrl ? '<a href="' + escapeHtml(event.locationUrl) + '" target="_blank" rel="noopener">' + escapeHtml(event.location) + '</a>' : escapeHtml(event.location)) + '</span>';
            document.getElementById('eventTicketActions').innerHTML =
                '<a href="' + escapeHtml(event.eventbrite) + '" class="btn btn-primary btn-small" target="_blank" rel="noopener">Eventbrite</a>' +
